[package]
name = "iroh-static-mesh"
version = "0.1.0"
edition = "2024"
authors = [ "GrizzlT" ]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "wiresneakd"
path = "src/daemon/main.rs"

# [[bin]]
# name = "wiresneak"
# path = "src/cli/main.rs"

[dependencies]
tun-rs = { version = "2", features = [ "async" ] }
iroh = "1.3"
tokio = { version = "1.53", features =[ "full" ] }
tokio-stream = "0.1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = [ "codec" ] }
bytes = "1.12"
prefix-trie = "0.10"
ipnet = { version = "2.12", features = [ "serde" ] }
serde = { version = "1.0", features = [ "derive" ] }
toml = { version = "1.1", features = [ "serde" ] }
anyhow = "1.0"
lexopt = "0.3"
hex = "0.4"
sd-notify = "0.5"
